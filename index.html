<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>อิ่มจัง · Imjang</title>
<meta name="description" content="เลี้ยงเพื่อนตัวน้อย ไปพร้อมกับกินดีอยู่ดี">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFF3E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#231C1B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="อิ่มจัง">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF3E6;--surf:#FFFFFF;--ink:#3B2F2F;--mute:#8A7770;--line:#F0DDCB;--coral:#FF8466;--coral-d:#E96B4C;--mint:#78CDB5;--mint-d:#4FB39A;--butter:#FFD36E;--sh:0 5px 0 rgba(120,80,50,.12);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#231C1B;--surf:#33292A;--ink:#FBEEE4;--mute:#BCA89E;--line:#4A3C3A;--sh:0 5px 0 rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai','Mali',system-ui,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,.fd{font-family:'Mali','Noto Sans Thai',system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:18px;background:var(--coral);color:#fff;font-weight:700;box-shadow:0 5px 0 var(--coral-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.btn.ghost{background:var(--surf);color:var(--ink);box-shadow:var(--sh);border:2px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.card{background:var(--surf);border-radius:22px;padding:16px;box-shadow:var(--sh);border:2px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mute{color:var(--mute);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surf);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;min-height:40px}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surf);border:2px solid var(--line)}
.lang{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surf)}
.lang button{padding:6px 14px;font-weight:700;min-height:40px}
.lang button.on{background:var(--ink);color:var(--bg)}
/* welcome */
.hero{text-align:center;padding-top:6px}
.hero h1{font-size:44px;letter-spacing:-.5px}
.hero p{margin:4px 0 0;color:var(--mute)}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{background:var(--surf);border:3px solid var(--line);border-radius:20px;padding:4px 2px 8px;text-align:center;box-shadow:var(--sh);font-weight:700;font-size:14px}
.pick img{width:100%;height:auto;display:block}
.pick.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--surf))}
/* onboarding */
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .3s}
.ob-pet{width:170px;margin:0 auto}
.pimg{width:100%;height:auto;display:block;user-select:none}
.bubble{position:relative;background:var(--surf);border:2px solid var(--line);border-radius:20px;padding:12px 16px;box-shadow:var(--sh);font-weight:500;text-align:center}
.bubble:after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;background:var(--surf);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.opts{display:grid;gap:10px}
.opt{background:var(--surf);border:3px solid var(--line);border-radius:18px;padding:12px 16px;text-align:left;font-weight:500;min-height:52px;box-shadow:var(--sh)}
.opt:active{border-color:var(--coral)}
.inp{width:100%;min-height:56px;border-radius:18px;border:3px solid var(--line);background:var(--surf);color:var(--ink);font:700 22px 'Mali',sans-serif;padding:0 16px;text-align:center}
.inp:focus{outline:none;border-color:var(--mint)}
.err{color:var(--coral-d);font-weight:700;min-height:22px;text-align:center}
.big{font:700 54px/1 'Mali',sans-serif;color:var(--coral-d)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.macros div{border-radius:16px;padding:10px 4px;font-weight:700}
.macros small{display:block;font-weight:500;color:var(--mute)}
.m-p{background:color-mix(in srgb,var(--mint) 25%,var(--surf))}.m-f{background:color-mix(in srgb,var(--butter) 30%,var(--surf))}.m-c{background:color-mix(in srgb,var(--coral) 18%,var(--surf))}
/* chat-style onboarding */
.bub{position:relative;background:var(--surf);border:2px solid var(--line);border-radius:24px;padding:28px 16px 14px;box-shadow:var(--sh);margin-top:18px}
.bub:after{content:"";position:absolute;left:calc(50% - 9px);bottom:-10px;width:18px;height:18px;background:var(--surf);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bub-h{position:absolute;top:-17px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.tag,.ans{border-radius:999px;padding:4px 14px;border:3px solid var(--surf);font:700 15px 'Mali','Noto Sans Thai',sans-serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.tag{background:var(--coral);max-width:58%}
.ans{background:var(--mint-d);max-width:48%}
.bt{margin:0 0 12px;font-size:18px;font-weight:500;line-height:1.5}
.bub .opts{gap:8px}
.bub .opt{box-shadow:none;border-width:2px;background:color-mix(in srgb,var(--mint) 12%,var(--surf));min-height:50px;font-size:17px}
.nx{display:flex;justify-content:flex-end}
.scene{aspect-ratio:900/520;margin-top:4px;cursor:default}
.scene .roombg{object-position:50% 70%}
.scene .petbox{width:44%;bottom:3%}
.wheelw{position:relative;height:144px}
.wheelw:before{content:"";position:absolute;left:0;right:0;top:48px;height:48px;border-radius:14px;background:var(--line);opacity:.7}
.wheel{position:relative;height:144px;overflow-y:auto;scroll-snap-type:y mandatory;padding:48px 0;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);border-radius:14px}
.wheel::-webkit-scrollbar{display:none}
.wheel:focus-visible{outline:3px solid var(--mint-d)}
.wi{height:48px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;gap:6px;font:700 22px 'Mali',sans-serif;color:var(--mute);cursor:pointer;user-select:none}
.wi small{font-size:14px;font-weight:500}
.wi.on{color:var(--ink);font-size:27px}
.hw{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.bar2{display:flex;height:30px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:8px}
.bar2 i{display:flex;align-items:center;justify-content:center;font:700 13px 'Noto Sans Thai',sans-serif;font-style:normal;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.def{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--coral) 28%,var(--surf)) 0 6px,var(--surf) 6px 12px);color:var(--coral-d)!important}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
/* intro, rings, plan */
.segs{display:flex;gap:6px;flex:1;margin-right:12px}
.segs i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.segs i.on{background:var(--coral)}
.iv{position:relative;display:grid;place-items:center;min-height:300px}
.ifoods span{position:absolute;font-size:34px;animation:fl 3.2s ease-in-out infinite}
.ifoods span:nth-child(1){left:6%;top:2%}.ifoods span:nth-child(2){right:8%;top:6%;animation-delay:-.6s}.ifoods span:nth-child(3){left:42%;top:-2%;animation-delay:-1.2s}
.ifoods span:nth-child(4){left:10%;bottom:0;animation-delay:-1.8s}.ifoods span:nth-child(5){right:12%;bottom:4%;animation-delay:-2.4s}.ifoods span:nth-child(6){left:46%;bottom:-4%;animation-delay:-3s}
@keyframes fl{50%{transform:translateY(-10px) rotate(6deg)}}
.icard{position:relative;z-index:1;width:100%;max-width:360px;background:var(--surf);border:2px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:14px;display:flex;align-items:center;gap:12px}
.icard.col{flex-direction:column;gap:14px}
.pill{border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700}
.stage.mini{width:100%;max-width:360px}
.ring{width:116px;aspect-ratio:1;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--mint) calc(var(--p,0)*1%),var(--line) 0)}
.ring>div{width:calc(100% - 22px);aspect-ratio:1;border-radius:50%;background:var(--surf);display:grid;place-content:center;text-align:center;line-height:1.15}
.ring b{font-size:22px}.ring small{color:var(--mute);font-size:11px}
.ring.ring-s{width:92px}.ring.ring-s b{font-size:17px}
.card.plan h2{font-size:22px}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;text-align:center;background:var(--bg);border-radius:16px;padding:10px 4px;gap:2px}
.eq.one{grid-template-columns:1fr}
.eq b{font:700 20px 'Mali',sans-serif;display:block}
.eq small{color:var(--mute);font-size:12px}
.eq .op{color:var(--mute);font:700 20px 'Mali',sans-serif}
.way{margin-top:14px}
.wbar{position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--line),var(--mint));margin:16px 0 10px}
.wbar span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surf);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.evnote{margin-top:10px;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--butter) 25%,var(--surf));font-weight:500;font-size:14px}
canvas#trace{width:100%;height:220px;background:var(--bg);border:2px dashed var(--line);border-radius:20px;touch-action:none;display:block}
/* home */
.stage{position:relative;border-radius:28px;border:2px solid var(--line);box-shadow:var(--sh);overflow:hidden;aspect-ratio:900/738;background:var(--veil,var(--surf))}
/* The scene is faded into the stage colour so the pet stands out. */
.roombg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;filter:saturate(.85)}
.bgth{position:relative;width:100%;aspect-ratio:900/738;border-radius:12px;overflow:hidden;background:var(--veil,var(--surf))}
.it .bgth .roombg{width:100%;height:100%;margin:0;opacity:1;filter:none}
/* week strip, meal groups, quick picks, weight */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wday{background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:6px 0 8px;display:grid;justify-items:center;gap:2px;min-height:64px}
.wday.today{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 10%,var(--surf))}
.wday small{color:var(--mute);font-size:12px;font-weight:700}
.wday b{font:700 16px 'Mali',sans-serif}
.dot{width:70%;height:6px;border-radius:9px;background:var(--line);overflow:hidden;display:flex}
.dot span{display:block;border-radius:9px}
.dot.good span{background:var(--mint)}.dot.some span{background:var(--butter)}.dot.over span{background:var(--coral)}
.mg+.mg{margin-top:6px;padding-top:4px;border-top:2px solid var(--line)}
.mg-h{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 0;font-size:14px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slots button{border:2px solid var(--line);background:var(--surf);border-radius:14px;min-height:44px;font-weight:700;font-size:13px;padding:0 2px}
.slots button.on{background:var(--coral);border-color:var(--coral-d);color:#fff}
.sheet>*{min-width:0}/* let scrolling rows scroll instead of widening the sheet */
.cats,.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar,.quick::-webkit-scrollbar{display:none}
.cats button{flex:none;border:2px solid var(--line);background:var(--surf);border-radius:999px;padding:4px 12px;min-height:38px;font-weight:700;font-size:14px}
.cats button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.qk{flex:none;display:grid;text-align:left;gap:2px;background:color-mix(in srgb,var(--butter) 22%,var(--surf));border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:500;max-width:200px}
.qk small{color:var(--mute);font-size:12px}
.evchip{background:color-mix(in srgb,var(--butter) 35%,var(--surf));border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
.wchart{width:100%;height:auto;display:block}
.wchart text{font:600 11px 'Noto Sans Thai',sans-serif;fill:var(--mute)}
.wlist{display:grid;gap:4px;margin-top:6px}
.inuse{min-height:40px;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--mint-d)}
.hearts{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:rgba(255,255,255,.78);border-radius:999px;padding:3px 10px}
.hearts svg{width:24px;height:24px}
.rail{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.rail img{width:38px;height:38px;background:rgba(255,255,255,.8);border-radius:12px;padding:2px;}
.petbox{position:absolute;left:50%;bottom:6%;width:58%;transform:translateX(-50%)}
.petbox img{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.petbox.chomp img{animation:chomp .5s ease-in-out 2}
@keyframes bob{50%{transform:translateY(-3px) scale(1.01,.99)}}
@keyframes chomp{50%{transform:scale(1.08,.92)}}
.fly{position:absolute;left:50%;top:60%;font-size:40px;animation:fly .65s ease-in forwards;pointer-events:none;z-index:3}
@keyframes fly{from{transform:translate(-50%,120px) scale(1.2);opacity:1}to{transform:translate(-50%,-30px) scale(.3);opacity:0}}
.pop{position:absolute;left:50%;top:28%;font:700 22px 'Mali',sans-serif;color:#fff;-webkit-text-stroke:5px #C4553A;paint-order:stroke fill;animation:pop 1.1s ease-out forwards;pointer-events:none;white-space:nowrap;z-index:3}
@keyframes pop{from{transform:translate(-50%,10px) scale(.6);opacity:0}30%{opacity:1}to{transform:translate(-50%,-30px) scale(1.15);opacity:0}}
.growl{position:absolute;left:50%;bottom:21%;transform:translateX(-50%);font:700 15px 'Mali',sans-serif;color:#fff;-webkit-text-stroke:4px #8A4B2A;paint-order:stroke fill;white-space:nowrap;pointer-events:none;animation:gr 1.6s ease-in-out infinite}
@keyframes gr{0%,100%{opacity:.45;transform:translateX(-50%) translateY(2px)}50%{opacity:1;transform:translateX(-50%) translateY(-2px)}}
.hatch{width:min(70vw,300px);margin:0 auto;cursor:pointer}
.himg{width:100%;height:auto;display:block;}
.wob{animation:wob 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.shake{animation:shk .12s linear 7;transform-origin:50% 90%}
@keyframes shk{0%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}100%{transform:rotate(-7deg)}}
.pop2{animation:pp .5s ease-out}
@keyframes pp{from{transform:scale(.6)}60%{transform:scale(1.12)}to{transform:scale(1)}}
.say{margin:8px 6px 6px}
.meter{height:18px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--mint);transition:width .5s}
.meter.over i{background:var(--butter)}
.mrow{display:grid;grid-template-columns:70px 1fr 74px;gap:8px;align-items:center;font-size:13px}
.mrow .meter{height:9px}
.meals{display:grid;gap:8px}
.meal{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:2px dashed var(--line)}
.meal:last-child{border:0}
.meal .e{font-size:26px}
.x{width:36px;height:36px;border-radius:12px;color:var(--mute);font-size:20px}
.dock{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dock .main{grid-column:1/-1;min-height:60px;font-size:18px}
/* sheet */
.wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.wrap.hidden{display:none}
.scrim{position:absolute;inset:0;background:rgba(40,25,20,.5)}
.sheet{position:relative;width:100%;max-width:480px;max-height:88dvh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:18px 16px max(20px,env(safe-area-inset-bottom));display:grid;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.foods{display:grid;gap:6px;max-height:300px;overflow:auto;padding-right:2px}
.food{background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:8px 10px;min-height:52px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.food .fe{font-size:24px;flex:none}
.food .fn{display:block;font-weight:500;line-height:1.3}
.food .fk{flex:none;text-align:right;font:700 16px 'Mali',sans-serif;line-height:1.1}
.food .fk small{display:block;font:500 11px 'Noto Sans Thai',sans-serif;color:var(--mute)}
.mac{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--mute);margin-top:2px}
.mac span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.mac i,.macin i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.mac.big{font-size:14px;color:var(--ink);gap:4px 14px;margin-top:4px}
.mp{background:var(--mint)}.mf{background:var(--butter)}.mc{background:var(--coral)}
.selsum{background:color-mix(in srgb,var(--coral) 8%,var(--surf));border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.selsum b{font-size:20px}
.macin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macin label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
.macin label span{display:flex;align-items:center;gap:4px}
.macin input{width:100%;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font:700 16px 'Mali',sans-serif;text-align:center}
.food.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,var(--surf))}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:8px}
.mrow{display:flex;gap:6px;align-items:stretch}.mrow .food{flex:1;min-width:0}
.del{flex:none;min-width:48px;padding:0 8px;border-radius:14px;border:2px solid var(--line);background:var(--surf);color:#D0452D;font-weight:700}
.del.on{background:#D0452D;color:#fff;border-color:#D0452D}
.keep{display:flex;align-items:flex-start;gap:8px;font-size:14px;min-height:44px;padding-top:4px}.keep input{width:22px;height:22px;flex:none;accent-color:var(--coral)}
.bkrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nudge{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--butter) 30%,var(--surf));border:2px solid var(--line);border-radius:16px;padding:8px 8px 8px 12px;font-weight:500}
.nudge .btn{min-height:40px;padding:0 14px;flex:none}
.cups{display:grid;gap:4px;margin:8px 0 4px}
.cup{height:34px;border-radius:8px 8px 12px 12px;border:2px solid color-mix(in srgb,#4AA8E0 45%,var(--line));background:var(--surf);min-width:0}
.cup.on{background:#4AA8E0;border-color:#3A8CC0}
.daycard .btn.sm{min-height:40px;padding:0 14px;flex:none}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.acts button{border:2px solid var(--line);background:var(--surf);border-radius:14px;min-height:56px;padding:4px;font-size:13px;font-weight:600;display:grid;justify-items:center;align-content:center;gap:2px;min-width:0}
.acts button span{font-size:20px}.acts button.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--surf))}
.miles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.miles div{border:2px solid var(--line);border-radius:14px;padding:6px;text-align:center;display:grid;font-size:13px;color:var(--mute)}
.miles div b{font-size:20px;color:var(--ink)}.miles div.on{border-color:#FF7A45;background:color-mix(in srgb,#FF7A45 12%,var(--surf))}
.pop.long{white-space:normal;width:88%;text-align:center;font-size:18px}
.rmt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rmt label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
.rmt input{width:100%;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font:600 14px 'Noto Sans Thai',sans-serif;text-align:center;min-width:0;padding:0 2px}
.rmt input::-webkit-calendar-picker-indicator{margin:0;padding:0;width:14px}
.keep a{color:var(--coral-d)}.fl{display:grid;gap:4px}.fl .mute{font-size:12px}.inp.tx{font:500 16px 'Noto Sans Thai',sans-serif;min-height:48px;text-align:left;border-radius:14px}
.lnk{background:none;border:0;color:var(--mute);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px;width:100%}
.seg button{border:2px solid var(--line);background:var(--surf);border-radius:14px;min-height:44px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--bg)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.pitem{display:flex;align-items:center;gap:8px;background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.pitem input[type=number]{width:78px;min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 16px 'Mali',sans-serif;text-align:center}
.thumb{width:100%;max-height:170px;object-fit:cover;border-radius:16px}
.tabs button{border-radius:14px;min-height:44px;font-weight:700;background:var(--surf);border:2px solid var(--line)}
.tabs button.on{background:var(--mint);border-color:var(--mint-d);color:#fff}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.it{background:var(--surf);border:2px solid var(--line);border-radius:18px;padding:8px;text-align:center;display:grid;gap:6px}
.it img{width:84px;height:84px;margin:0 auto;}
.it.worn{border-color:var(--mint-d)}
.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:14px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const ACTF=[1.2,1.375,1.55,1.725],SPD=[0.25,0.5,0.75];
/* Mifflin-St Jeor resting energy (kcal/day). */
function bmrOf(p){const adj=p.sex==='m'?5:p.sex==='f'?-161:-78;return 10*p.w+6.25*p.h-5*p.age+adj}
function calcPlan(p){
  const bmr=bmrOf(p);
  const tdee=bmr*ACTF[p.act];
  const floor=p.sex==='m'?1500:1200;
  const diff=p.gw-p.w;
  const dir=Math.abs(diff)<0.5?0:(diff<0?-1:1);
  let target=tdee,capped=false,rate=0;
  if(dir<0){
    let d=SPD[p.sp]*7700/7;const cap=tdee*0.25;
    if(d>cap){d=cap;capped=true}
    target=tdee-d;
    if(target<floor){target=floor;capped=true}
    target=Math.min(target,tdee);
    rate=(tdee-target)*7/7700;
  }else if(dir>0){
    let s=SPD[p.sp]*7700/7;const cap=tdee*0.2;
    if(s>cap){s=cap;capped=true}
    target=tdee+s;rate=s*7/7700;
  }
  target=Math.round(target/10)*10;
  const weeks=rate>0.05?Math.ceil(Math.abs(diff)/rate):0;
  const pg=Math.round(1.6*p.w),fg=Math.round(target*0.25/9);
  const cg=Math.max(0,Math.round((target-pg*4-fg*9)/4));
  return{bmr:Math.round(bmr/10)*10,tdee:Math.round(tdee/10)*10,target,dir,capped,weeks,rate:Math.round(rate*100)/100,p:pg,f:fg,c:cg};
}

/* ============ ACCOUNT (the app's own server: server/main.js) ============
   Only where the page is served by that server (it answers api/ping); on GitHub Pages or inside Claude there is none.
   ACCT={tok,name,rev,ts}: rev = the server copy this device last matched, ts = S.ts at that moment,
   so S.ts>ACCT.ts means this device has changes the account has not seen yet. */
const AKEY='imjang.acct';
let ACCT=null;try{ACCT=JSON.parse(localStorage.getItem(AKEY)||'null')}catch(e){}
let SRV=false,acSt='',acT=null,acBusy=false,acAgain=false,acAt=0,acPulled=0;

const acDirty=()=>!!ACCT&&(S.ts||0)>(ACCT.ts||0);
async function api(method,p,body){
  const h={'Content-Type':'application/json'};if(ACCT&&ACCT.tok)h.Authorization='Bearer '+ACCT.tok;
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),15000);
  try{
    const r=await fetch('api/'+p,{method,headers:h,cache:'no-store',signal:ctl.signal,body:body===undefined?undefined:JSON.stringify(body)});
    let j=null;try{j=await r.json()}catch(e){}
    return {s:r.status,j:j||{}};
  }finally{clearTimeout(tm)}
}
/* writes the state locally without touching S.ts, so taking the account's copy does not count as a change */
function keepLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function acExpired(){if(ACCT){ACCT.tok=null;keepAcct()}acSt='exp';acShow()}
function acSched(){if(!acOn())return;clearTimeout(acT);acT=setTimeout(acPush,1500)}
async function acPush(){
  if(!acOn())return;
  if(acBusy){acAgain=true;return}
  acBusy=true;acSt='busy';acShow();
  try{
    for(let i=0;i<3;i++){
      const ts=S.ts||0,r=await api('PUT','save',{base:ACCT.rev||0,data:S});
      if(r.s===200){ACCT.rev=r.j.rev;ACCT.ts=ts;acSt='ok';acAt=Date.now();break}
      if(r.s===409){acTake(r.j,true);continue}
      if(r.s===401){acExpired();break}
      acSt='off';break;
    }
  }catch(e){acSt='off'}
  acBusy=false;keepAcct();acShow();
  if(acAgain){acAgain=false;if(acDirty())acSched()}
}
/* the account has a newer copy {rev,data}: take it, or fold this device's unsent changes into it */
function acTake(rm,dirty){
  if(!rm||!rm.data)return;
  const was=JSON.stringify(S);
  S=Object.assign(defState(),dirty?mergeSaves(S,rm.data):rm.data);normalize();
  ACCT.rev=rm.rev;
  if(dirty)S.ts=Math.max(S.ts||0,Date.now());else ACCT.ts=S.ts||0;
  keepLocal();keepAcct();
  if(JSON.stringify(S)!==was)acRedraw();
}
/* Two copies changed apart (say, phone offline and tablet online): keep the newer one and add the other's
   meals, water, activity, weigh-ins and own foods it does not have. Coins, pet and plan come from the newer. */
function mergeSaves(a,b){
  const [n,o]=(a.ts||0)>=(b.ts||0)?[a,b]:[b,a],m=JSON.parse(JSON.stringify(n));
  const byDay=(f,key)=>{m[f]=m[f]||{};Object.keys(o[f]||{}).forEach(d=>{const have=m[f][d]||[],ks=new Set(have.map(key));m[f][d]=have.concat((o[f][d]||[]).filter(x=>!ks.has(key(x))))})};
  byDay('logs',x=>[x.n,x.k,x.m,x.t].join('|'));
  byDay('moves',x=>[x.a,x.min,x.t].join('|'));
  m.water=m.water||{};Object.keys(o.water||{}).forEach(d=>{m.water[d]=Math.max(m.water[d]||0,o.water[d]||0)});
  const uni=(f,key)=>{const have=Array.isArray(m[f])?m[f]:[],ks=new Set(have.map(key));m[f]=have.concat((Array.isArray(o[f])?o[f]:[]).filter(x=>!ks.has(key(x))))};
  uni('weights',x=>x&&x.d);if(Array.isArray(m.weights))m.weights.sort((x,y)=>x.d<y.d?-1:1);
  uni('myFoods',x=>x&&x.id);uni('owned',x=>x);uni('bgOwned',x=>x);
  m.bonus=Object.assign({},o.bonus||{},m.bonus||{});
  return m;
}
async function acPull(force){
  if(!acOn()||acBusy)return;
  if(!force&&Date.now()-acPulled<10000)return;
  acPulled=Date.now();
  try{
    const r=await api('GET','save');
    if(r.s===401)return acExpired();
    if(r.s!==200){acSt='off';return acShow()}
    if(r.j.rev!==(ACCT.rev||0)&&r.j.data)acTake(r.j,acDirty());
    if(acDirty())acPush();else{acSt='ok';acAt=Date.now();acShow()}
  }catch(e){acSt='off';acShow()}
}

const pad=n=>String(n).padStart(2,'0');

const today=()=>dkey();
function yest(){const d=new Date();d.setDate(d.getDate()-1);return dkey(d)}
function rollover(){
  if(S.lastDay&&S.lastDay!==today()&&S.lastDay!==yest())S.streak=0;
  const keep=Object.keys(S.logs).sort().slice(-14);const nl={};keep.forEach(k=>nl[k]=S.logs[k]);S.logs=nl;
  /* water and activity are kept for the same 14 days */
  const d=new Date();d.setDate(d.getDate()-13);const from=dkey(d);
  ['water','moves'].forEach(f=>{const o={};Object.keys(S[f]||{}).forEach(k=>{if(k>=from)o[k]=S[f][k]});S[f]=o});

/* Saves from older versions (local or synced): retired pets (bear, fox, …) become the cat. */
const OLDSP={rabbit:'bunny'};
function normalize(){
  if(!S.pet)S.pet={sp:'cat',name:''};
  if(OLDSP[S.pet.sp])S.pet.sp=OLDSP[S.pet.sp];
  if(!SP.includes(S.pet.sp))S.pet.sp='cat';
  if(!Array.isArray(S.worn))S.worn=[];
  S.worn=S.worn.filter(i=>ACC[i]);S.owned=(S.owned||[]).filter(i=>ACC[i]);
  S.bgOwned=(Array.isArray(S.bgOwned)?S.bgOwned:[]).filter(i=>BGS[i]);
  if(!S.bgOwned.includes('room'))S.bgOwned.unshift('room');
  if(!S.bgOwned.includes(S.bg))S.bg='room';
  /* foods the user typed and kept: {id:'u_…',e,n,k,p,f,c} */
  S.myFoods=(Array.isArray(S.myFoods)?S.myFoods:[]).filter(m=>m&&typeof m.id==='string'&&m.n&&m.k>0);
  /* water {day: glasses}, moves {day: [{a,min,k,t}]}, meal-time reminders */
  if(!S.water||typeof S.water!=='object'||Array.isArray(S.water))S.water={};
  if(!S.moves||typeof S.moves!=='object'||Array.isArray(S.moves))S.moves={};
  const hm=/^\d\d:\d\d$/,rd=defState().remind;
  S.remind=Object.assign({},rd,S.remind&&typeof S.remind==='object'?S.remind:{});
  ['b','l','d'].forEach(s=>{if(!hm.test(S.remind[s]))S.remind[s]=rd[s]});S.remind.on=S.remind.on!==false;
  /* weigh-ins: older saves had only the weight from the questions */
  if(!Array.isArray(S.weights))S.weights=[];
  const pr=S.prof;
  if(pr){
    if(!pr.goal)pr.goal=pr.gw<pr.w-0.5?'lose':pr.gw>pr.w+0.5?'gain':'keep';
    if(!pr.start){const d0=Object.keys(S.logs||{}).sort()[0];pr.start={d:d0&&d0<today()?d0:today(),w:pr.w,rate:S.plan&&S.plan.rate||0}}
    if(!S.weights.length)S.weights=[{d:pr.start.d,w:pr.start.w}];
  }
  rollover();
}

const ROW=48;

function wheel(id,vals,cur,unit,label){

function bindWheel(id,vals,onChange){
  const el=$('#'+id),items=el.querySelectorAll('.wi');
  let i=+el.dataset.i;el.scrollTop=i*ROW;
  const set=k=>{k=Math.max(0,Math.min(vals.length-1,k));if(k===i)return;items[i].classList.remove('on');i=k;items[i].classList.add('on');el.setAttribute('aria-valuenow',vals[i]);if(onChange)onChange(vals[i])};
  el.addEventListener('scroll',()=>set(Math.round(el.scrollTop/ROW)),{passive:true});
  el.onkeydown=e=>{const d={ArrowUp:-1,ArrowDown:1,PageUp:-5,PageDown:5}[e.key];if(d){e.preventDefault();el.scrollTo({top:Math.max(0,i+d)*ROW,behavior:'smooth'})}};

function rPledge(){
  const t=L(),o=t.ob,n=esc(S.pet.name);
  app.innerHTML=`<div class="top"><span></span>${langSw()}</div><div class="sp"></div>
  ${bubble(n,'',fmt(o.pT,{n}),`<p style="margin:0 0 12px;font-weight:700;font-size:20px" class="fd">${fmt(o.pText,{n})}</p>
   <canvas id="trace" aria-label="${esc(o.pHint)}"></canvas>
   <div class="row" style="margin-top:8px"><span class="mute sp" id="ph">${o.pHint}</span><button class="btn ghost sm" id="clr">${t.clear}</button></div>
   <button class="btn block" id="ok" disabled style="margin-top:12px">${t.promise}</button>`)}
  ${petScene('-happy',0)}`;
  bindLang();
  const cv=$('#trace'),dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const cx=cv.getContext('2d');cx.scale(dpr,dpr);
  const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const N=56,s=Math.min(w*0.8/32,h*0.82/30),ox=w/2,oy=h/2-s*2;
  const pts=[];for(let k=0;k<N;k++){const a=k/N*Math.PI*2;pts.push([ox+16*Math.sin(a)**3*s,oy-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*s])}
  let hit=new Array(N).fill(false),down=false,lx=0,ly=0,done=false;
  const dots=()=>{pts.forEach(([x,y],k)=>{cx.beginPath();cx.arc(x,y,hit[k]?6:4,0,7);cx.fillStyle=hit[k]?css('--coral'):css('--line');cx.fill()})};
  const reset=()=>{cx.clearRect(0,0,w,h);hit.fill(false);done=false;$('#ok').disabled=true;$('#ph').textContent=o.pHint;dots()};
  reset();
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{down=true;[lx,ly]=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}};
  cv.onpointermove=e=>{
    if(!down)return;const[x,y]=pos(e);
    cx.strokeStyle=css('--coral');cx.lineWidth=6;cx.lineCap='round';cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(x,y);cx.stroke();lx=x;ly=y;
    pts.forEach(([px,py],k)=>{if(!hit[k]&&Math.hypot(px-x,py-y)<24)hit[k]=true});dots();
    if(!done&&hit.filter(Boolean).length>=N*0.85){done=true;$('#ok').disabled=false;$('#ph').textContent=o.pDone;try{navigator.vibrate&&navigator.vibrate(30)}catch(_){}}
  };
  cv.onpointerup=cv.onpointercancel=()=>{down=false};
  $('#clr').onclick=reset;
  $('#ok').onclick=()=>{S.onboarded=true;save();go('home')};
}

function weightChart(t){
  const pr=S.prof,ws=S.weights,st=pr.start;

  const dir=pr.goal==='lose'?-1:pr.goal==='gain'?1:0,rate=st.rate||0;
  const planAt=x=>{const v=st.w+dir*rate*(x-dS)/7;return dir<0?Math.max(pr.gw,v):dir>0?Math.min(pr.gw,v):st.w};
  const knot=dir&&rate?Math.min(dl,dS+Math.abs(st.w-pr.gw)/rate*7):dl;
  const vals=[...pts.map(p=>p[1]),st.w,planAt(dl),...(dir?[pr.gw]:[])];

  const sd=s=>new Date(s*864e5).toLocaleDateString(S.lang==='th'?'th-TH':'en-GB',{day:'numeric',month:'short'});
  const line=pts.map(p=>`${X(p[0])},${Y(p[1])}`).join(' ');
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.wt.title}">
   <line x1="${Lp}" x2="${W-R}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)"/><line x1="${Lp}" x2="${W-R}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)"/>
   <text x="${Lp-6}" y="${+Y(hi)+4}" text-anchor="end">${hi}</text><text x="${Lp-6}" y="${+Y(lo)+4}" text-anchor="end">${lo}</text>
   ${dir?`<line x1="${Lp}" x2="${W-R}" y1="${Y(pr.gw)}" y2="${Y(pr.gw)}" stroke="var(--coral)" stroke-dasharray="3 4"/><text x="${W-R}" y="${+Y(pr.gw)-5}" text-anchor="end" fill="var(--coral-d)">🏁 ${f1(pr.gw)}</text>`:''}
   <polyline points="${X(dS)},${Y(planAt(dS))} ${X(knot)},${Y(planAt(knot))} ${X(dl)},${Y(planAt(dl))}" fill="none" stroke="var(--mint)" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
   ${pts.length>1?`<polyline points="${line}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`:''}
   ${pts.map((p,i)=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?'var(--coral)':'var(--ink)'}"/>`).join('')}
   <text x="${Lp}" y="${H-4}">${sd(d0)}</text><text x="${W-R}" y="${H-4}" text-anchor="end">${sd(dl)}</text>
  </svg><div class="legend" style="justify-content:center"><span><i style="background:var(--ink)"></i>${t.wt.you}</span><span><i style="background:var(--mint)"></i>${t.wt.plan}</span>${dir?`<span><i style="background:var(--coral)"></i>${t.wt.goal}</span>`:''}</div>`;
}

function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const m=900,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>b?res({blob:b,url:URL.createObjectURL(b)}):rej(new Error('blob')),'image/jpeg',.82);
      URL.revokeObjectURL(url);
    };
    im.onerror=()=>rej(new Error('img'));im.src=url;
  });
}

  pf.onchange=async()=>{
    const f=pf.files&&pf.files[0];if(!f)return;
    photo={st:'busy',items:[],url:''};drawAdd();
    try{
      const {blob,url}=await shrink(f);photo.url=url;
      const prompt='You are a nutrition estimator for Thai and everyday foods. Look at the photo and list each distinct food or drink with the portion visible. Estimate calories and macros per item for that portion. Reply with JSON only, no prose: {"items":[{"th":"Thai name","en":"English name","emoji":"one emoji","kcal":0,"p":0,"f":0,"c":0}]}. kcal integers, p/f/c grams. If no food is visible reply {"items":[]}.';
      const out=await SAMPLE(prompt,{images:[blob],modelTier:'quick'});
      const items=parseItems(out.text||'');
      if(!items.length)throw new Error('none');
      photo.items=items;photo.st='done';
    }catch(e){photo.st='err'}
    if(tab==='photo'&&!$('#wrap').classList.contains('hidden'))drawAdd();
  };
  sh.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{photo.items[+c.dataset.c].on=c.checked;drawAdd()});
  sh.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{photo.items[+c.dataset.k].k=Math.max(0,Math.round(+c.value||0));drawAdd()});
  const pg=sh.querySelector('#pg');
  if(pg)pg.onclick=()=>{
    const on=photo.items.filter(i=>i.on);if(!on.length)return;
    feed({m:mslot,e:on[0].e,n:on.map(i=>i.n).join(' + ').slice(0,60),k:photoTotal(),p:on.reduce((a,i)=>a+i.p,0),f:on.reduce((a,i)=>a+i.f,0),c:on.reduce((a,i)=>a+i.c,0)});
  };
}
function feed(item){
  closeSheet();
  const t=L(),before=moodNow().m;
  const day=today();
  item.t=item.t||hhmm();item.m=SLOTS.includes(item.m)?item.m:slotNow();
  S.logs[day]=S.logs[day]||[];S.logs[day].push(item);
  let gain=0,mile=null;
  if(S.lastDay!==day){
    S.days++;S.streak=(S.lastDay===yest()?S.streak:0)+1;S.lastDay=day;
    /* the streak goes up once a day, so a milestone is paid once each time it is reached */
    mile=MILES.find(([m])=>m===S.streak)||null;if(mile)gain+=mile[1];
  }
  if(S.logs[day].length<=4)gain+=10;
  const m=moodNow();
  if(m.m==='loved'&&!S.bonus[day]){S.bonus[day]=1;gain+=20}
  S.coins+=gain;save();
  const st=$('#stage'),pet=$('#pet');
  if(!st||!pet){render();return}
  const fl=document.createElement('span');fl.className='fly';fl.textContent=item.e;fl.setAttribute('aria-hidden','true');st.appendChild(fl);
  setTimeout(()=>{
    rHome();
    const p2=$('#pet'),s2=$('#stage');if(!p2)return;
    p2.classList.add('chomp');
    const im=p2.querySelector('img'),orig=im?im.getAttribute('src'):null;
    if(im)im.src=`${IMG}${S.pet.sp}-${stage()}-eating.webp`;
    const pop=document.createElement('span');pop.className='pop';pop.textContent=L().snd[S.pet.sp]+(gain?'  '+fmt(L().coin,{n:gain}):'');s2.appendChild(pop);
    setTimeout(()=>{pop.remove();p2.classList.remove('chomp');if(im&&orig&&document.contains(im))im.setAttribute('src',orig);
      /* never cover a sheet the user opened meanwhile; the coins were already shown in the pop */
      if(mile&&$('#wrap').classList.contains('hidden'))mileSheet(mile)},1400);
  },650);
}
let wardTab='wear';
function sheetWard(){
  const t=L();
  const items=wardTab==='bg'?Object.keys(BGS).map(id=>{
    const b=BGS[id],own=S.bgOwned.includes(id),on=bgCur()===id;
    const btn=on?`<span class="inuse">✓ ${t.bgOn}</span>`:!own?`<button class="btn sm" data-bb="${id}">${t.buy} · ${b.p}</button>`:`<button class="btn sm mint" data-bu="${id}">${t.bgUse}</button>`;
    return `<div class="it ${on?'worn':''}"><div class="bgth"${veil(id)}>${roomImg(id)}</div><div style="font-weight:700;font-size:14px">${t.bgs[id]}</div>${btn}</div>`;
  }).join(''):Object.keys(ACC).map(id=>{
    const a=ACC[id],own=S.owned.includes(id),on=S.worn.includes(id);
    const btn=!own?`<button class="btn sm" data-b="${id}">${t.buy} · ${a.p}</button>`:`<button class="btn sm ${on?'ghost':'mint'}" data-w="${id}">${on?t.take:t.wear}</button>`;
    return `<div class="it ${on?'worn':''}"><img src="${IMG}wear-${id}.webp" alt="" width="200" height="200"><div style="font-weight:700;font-size:14px">${t.acc[id]}</div>${btn}</div>`;
  }).join('');
  openSheet(`<div class="row"><h3 class="fd sp">${t.wT}</h3><span class="chip">${I('coin','style="color:#E0A800"')}${S.coins}</span></div>
  <div class="tabs" role="tablist"><button data-wt="wear" role="tab" aria-selected="${wardTab==='wear'}" class="${wardTab==='wear'?'on':''}">${t.tabWear}</button><button data-wt="bg" role="tab" aria-selected="${wardTab==='bg'}" class="${wardTab==='bg'?'on':''}">${t.tabBg}</button></div>
  <div class="items">${items}</div><div class="err" id="we"></div><button class="btn ghost block" id="cl">${t.close}</button>`);
  const sh=$('#sheet');
  sh.querySelectorAll('[data-wt]').forEach(b=>b.onclick=()=>{wardTab=b.dataset.wt;sheetWard()});
  sh.querySelectorAll('[data-bb]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.bb,p=BGS[id].p;
    if(S.coins<p){$('#we').textContent=t.poor;return}
    S.coins-=p;S.bgOwned.push(id);S.bg=id;save();rHome();sheetWard();
  });
  sh.querySelectorAll('[data-bu]').forEach(b=>b.onclick=()=>{S.bg=b.dataset.bu;save();rHome();sheetWard()});
  sh.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.b,a=ACC[id];
    if(S.coins<a.p){$('#we').textContent=t.poor;return}
    S.coins-=a.p;S.owned.push(id);S.worn.push(id);if(S.worn.length>5)S.worn.shift();save();rHome();sheetWard();
  });
  sh.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.w;
    if(S.worn.includes(id))S.worn=S.worn.filter(x=>x!==id);else{S.worn.push(id);if(S.worn.length>5)S.worn.shift()}
    save();rHome();sheetWard();
  });
  $('#cl').onclick=()=>{closeSheet();rHome()};
}
function sheetSettings(){
  const t=L();
  openSheet(`<h3 class="fd">${t.sT}</h3>
  <div class="row"><b class="sp">${t.lang}</b>${langSw()}</div>
  <div><b>${t.rename}</b><div class="row" style="margin-top:6px"><input class="inp" id="rn" maxlength="12" style="font:500 16px 'Noto Sans Thai',sans-serif;min-height:48px;text-align:left" value="${esc(S.pet.name)}"><button class="btn mint sm" id="rs">${t.save}</button></div></div>
  <div><b>${t.change}</b><div class="grid6" style="margin-top:6px">${SP.map(s=>`<button class="pick ${S.pet.sp===s?'on':''}" data-s="${s}" style="padding:2px 2px 6px;font-size:13px">${pimg(s,'-happy',1,t.sp[s])}${t.sp[s]}</button>`).join('')}</div></div>
  <button class="btn ghost block" id="why">${t.why}</button>
  <button class="btn ghost block" id="rd">${t.redo}</button>
  <button class="btn ghost block" id="rt" style="color:#D0452D">${t.reset}</button>
  ${accountCard(t)}

  ${remindCard(t)}

  ${SRV?'':`<div class="card" style="padding:12px"><b>${t.syncT}</b><div class="mute">${syncSt==='on'?t.syncOn:syncSt==='err'?t.syncErr:t.syncOff}</div></div>`}
  <p class="mute" style="margin:0">${t.about}</p>

  const sh=$('#sheet');
  const ib=sh.querySelector('#inst');
  if(ib)ib.onclick=async()=>{const e=instEvt;if(!e)return;instEvt=null;try{e.prompt();await e.userChoice}catch(_){}sheetSettings()};
  bindBackup(t);bindRemind(t);bindAccount(t);
  sh.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();render();sheetSettings()});
  sh.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.pet.sp=b.dataset.s;save();warmArt();render();sheetSettings()});
  $('#rs').onclick=()=>{S.pet.name=($('#rn').value.trim()||t.defName[S.pet.sp]).slice(0,12);save();closeSheet();rHome()};
  $('#rd').onclick=()=>{closeSheet();startOb();go('onb')};
  $('#why').onclick=()=>{closeSheet();go('plan')};
  $('#rt').onclick=()=>{
    openSheet(`<h3 class="fd">${t.reset}</h3><p style="margin:0">${t.resetAsk}${acOn()?' '+t.resetAcc:''}</p><button class="btn block" id="y" style="background:#D0452D;box-shadow:0 5px 0 #A33520">${t.yes}</button><button class="btn ghost block" id="n">${t.no}</button>`);
    $('#y').onclick=()=>{const l=S.lang;S=defState();S.lang=l;save();closeSheet();go('welcome')};
    $('#n').onclick=sheetSettings;
  };
  $('#cl').onclick=()=>{closeSheet();rHome()};
}
/* ============ BACKUP ============ */
/* Outside Claude the save lives only in this browser, so the user can carry it to a new device as a JSON file.
   Inside Claude the save is synced already, so the card is not shown. */
function backupCard(t){
  if(window.claude)return '';
  const last=S.lastBackup?fmt(t.bkLast,{d:fmtDate(new Date(S.lastBackup+'T00:00'))}):t.bkNever;
  return `<div class="card" style="padding:12px;display:grid;gap:8px"><div><b>${t.bkT}</b><div class="mute" style="font-size:13px">${acOn()?t.bkHintAcc:t.bkHint}</div><div class="mute" style="font-size:13px;margin-top:4px" id="bkl">${last}</div></div>
  <div class="bkrow"><button class="btn mint sm" id="bko">${t.bkOut}</button><button class="btn ghost sm" id="bki">${t.bkIn}</button></div>
  <input type="file" id="bkf" accept="application/json,.json" class="hidden"><div class="err" id="bke" role="alert" style="min-height:0"></div></div>`;
}
/* Hands a file to the user; false when they cancelled the share sheet. */
async function saveFile(name,type,text){
  const file=new File([text],name,{type});
  /* an installed app on iPhone cannot download files, so hand it to the share sheet (Save to Files, AirDrop, …) */
  if(isIos()&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return true}catch(e){if(e&&e.name==='AbortError')return false}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  return true;
}
async function exportBackup(){
  const ok=await saveFile(`imjang-backup-${today()}.json`,'application/json',JSON.stringify({app:'imjang',v:1,at:new Date().toISOString(),data:S}));
  if(!ok)return false;
  S.lastBackup=today();save();return true;
}
/* ============ REMINDERS ============ */
function remindCard(t){
  const r=S.remind;
  return `<div class="card" style="padding:12px;display:grid;gap:8px"><b>⏰ ${t.rmT}</b>
  <label class="keep" style="padding-top:0"><input type="checkbox" id="rmon" ${r.on?'checked':''}> <span>${t.rmIn}</span></label>
  <div class="rmt">${['b','l','d'].map(s=>`<label><span>${t.rmSlot[s]}</span><input type="time" data-rm="${s}" value="${r[s]}"></label>`).join('')}</div>
  ${window.claude?'':`<button class="btn ghost sm block" id="rmcal">📅 ${t.rmCal}</button><div class="mute" style="font-size:12px">${t.rmCalHint}</div>`}</div>`;
}
/* A calendar file with one daily event per meal, each with an alert at its start (local, floating time). */
function icsText(t){
  const esc2=s=>String(s).replace(/\\/g,'\\\\').replace(/([,;])/g,'\\$1').replace(/\n/g,'\\n');
  const d=new Date(),ymd=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const url=location.href.split('#')[0].split('?')[0];
  const ev=['b','l','d'].map(s=>{
    const [h,m]=S.remind[s].split(':'),title=fmt(t.calTitle,{n:S.pet.name||t.app,s:t.rmSlot[s]});
    return ['BEGIN:VEVENT',`UID:imjang-${s}-${ymd}@imjang`,`DTSTAMP:${stamp}`,`DTSTART:${ymd}T${h}${m}00`,'DURATION:PT10M','RRULE:FREQ=DAILY',
      `SUMMARY:${esc2(title)}`,`DESCRIPTION:${esc2(t.calBody+'\n'+url)}`,`URL:${url}`,
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${esc2(title)}`,'TRIGGER:PT0M','END:VALARM','END:VEVENT'].join('\r\n');
  });
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Imjang//Meal reminders//EN','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n')+'\r\n';
}
function bindRemind(t){
  const on=$('#rmon');if(!on)return;
  on.onchange=()=>{S.remind.on=on.checked;save()};
  document.querySelectorAll('[data-rm]').forEach(i=>i.onchange=()=>{if(/^\d\d:\d\d$/.test(i.value)){S.remind[i.dataset.rm]=i.value;save()}});
  const c=$('#rmcal');if(c)c.onclick=()=>saveFile('imjang-reminders.ics','text/calendar',icsText(t));
}
/* accepts our own export, or a bare save object */
function readBackup(txt){
  let o;try{o=JSON.parse(txt)}catch(e){return null}
  const d=o&&o.app==='imjang'&&o.data?o.data:o;
  if(!d||typeof d!=='object'||Array.isArray(d)||!d.pet||typeof d.pet!=='object'||!d.logs||typeof d.logs!=='object'||Array.isArray(d.logs))return null;
  return {d,at:o&&o.at||null};
}
function bindBackup(t){
  const o=$('#bko');if(!o)return;
  o.onclick=async()=>{if(await exportBackup()){const l=$('#bkl');if(l)l.textContent=fmt(t.bkLast,{d:fmtDate(new Date())})}};
  const fi=$('#bkf');
  $('#bki').onclick=()=>{fi.value='';fi.click()};
  fi.onchange=()=>importBackup(fi.files&&fi.files[0],t,()=>{$('#bke').textContent=t.bkBad},sheetSettings);
}
/* restore a file on the welcome screen, before there is a pet (and before settings can be reached) */
function welcomeImport(t){
  if(window.claude)return;
  const fi=document.createElement('input');fi.type='file';fi.accept='application/json,.json';
  fi.onchange=()=>importBackup(fi.files&&fi.files[0],t,()=>{const e=$('#wke');if(e)e.textContent=t.bkBad},()=>{closeSheet()});
  fi.click();
}
async function importBackup(f,t,bad,back){
    if(!f)return;
    if(f.size>5e6)return bad();
    let txt;try{txt=await f.text()}catch(e){return bad()}
    const b=readBackup(txt);if(!b)return bad();
    const d=b.d,sp=SP.includes(d.pet.sp)?d.pet.sp:OLDSP[d.pet.sp]||'cat';
    const at=b.at&&!isNaN(new Date(b.at))?new Date(b.at):null;
    openSheet(`<h3 class="fd">${t.bkIn}</h3>
    <div class="row"><div style="width:72px;flex:none">${pimg(sp,'-happy',1,t.sp[sp])}</div><div class="sp"><b>${esc(d.pet.name||t.sp[sp])}</b><div class="mute" style="font-size:13px">${fmt(t.bkInfo,{n:t.sp[sp],d:(+d.days||0).toLocaleString(),c:(+d.coins||0).toLocaleString()})}</div>${at?`<div class="mute" style="font-size:13px">${fmt(t.bkFrom,{d:fmtDate(at)})}</div>`:''}</div></div>
    <p style="margin:0">${t.bkAsk}</p>
    <button class="btn block" id="y">${t.bkYes}</button><button class="btn ghost block" id="n">${t.no}</button>`);
    $('#n').onclick=back;
    $('#y').onclick=()=>{
      S=Object.assign(defState(),d);S.introSeen=true;normalize();
      if(at)S.lastBackup=dkey(at);
      save();closeSheet();
      go(S.onboarded&&S.plan?'home':'welcome');warmArt();
    };
}
/* ============ PWA ============ */
let instEvt=null;
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIos=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e});
window.addEventListener('appinstalled',()=>{instEvt=null});
function installCard(t){
  if(window.claude)return '';/* running inside Claude Artifacts: nothing to install */
  let body;
  if(standalone())body=`<div class="mute">${t.instDone}</div>`;
  else if(instEvt)body=`<button class="btn mint block sm" id="inst" style="margin-top:8px">${t.instBtn}</button>`;
  else if(isIos())body=`<div class="mute">${t.instIos}</div>`;
  else return '';
  return `<div class="card" style="padding:12px"><b>${t.instT}</b>${body}</div>`;
}
/* warm the offline cache with the art this pet will need */
function prefetchArt(){
  const sp=S.pet.sp,names=['room',`egg-${sp}`,`egg-${sp}-8`];
  for(let g=0;g<3;g++)['','-happy','-hungry','-fat','-eating','-asleep'].forEach(s=>names.push(`${sp}-${g}${s}`));
  Object.keys(ACC).forEach(id=>names.push('wear-'+id));
  names.forEach(n=>fetch(IMG+n+'.webp').catch(()=>{}));
  Object.values(BGS).forEach(b=>fetch(b.src).catch(()=>{}));
}
function warmArt(){if(navigator.serviceWorker&&navigator.serviceWorker.controller)prefetchArt()}
function initPWA(){
  if(window.claude||!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(prefetchArt).catch(()=>{});
}
/* ============ BOOT ============ */
view=S.onboarded&&S.plan?'home':S.introSeen?'welcome':'intro';
render();
initSync();initSample();initPWA();initAcct();
