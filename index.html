<style>
:root{--bg:#FFF3E6;--surf:#FFFFFF;--ink:#3B2F2F;--mute:#8A7770;--line:#F0DDCB;--coral:#FF8466;--coral-d:#E96B4C;--mint:#78CDB5;--mint-d:#4FB39A;--butter:#FFD36E;--sh:0 5px 0 rgba(120,80,50,.12);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#231C1B;--surf:#33292A;--ink:#FBEEE4;--mute:#BCA89E;--line:#4A3C3A;--sh:0 5px 0 rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai','Mali',system-ui,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,.fd{font-family:'Mali','Noto Sans Thai',system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:18px;background:var(--coral);color:#fff;font-weight:700;box-shadow:0 5px 0 var(--coral-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.btn.ghost{background:var(--surf);color:var(--ink);box-shadow:var(--sh);border:2px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.card{background:var(--surf);border-radius:22px;padding:16px;box-shadow:var(--sh);border:2px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mute{color:var(--mute);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surf);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;min-height:40px}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surf);border:2px solid var(--line)}
.lang{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surf)}
.lang button{padding:6px 14px;font-weight:700;min-height:40px}
.lang button.on{background:var(--ink);color:var(--bg)}
/* welcome */
.hero{text-align:center;padding-top:6px}
.hero h1{font-size:44px;letter-spacing:-.5px}
.hero p{margin:4px 0 0;color:var(--mute)}
.grid6{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick{background:var(--surf);border:3px solid var(--line);border-radius:20px;padding:4px 2px 8px;text-align:center;box-shadow:var(--sh);font-weight:700;font-size:14px}
.pick img{width:100%;height:auto;display:block}
.pick.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--surf))}
/* onboarding */
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .3s}
.ob-pet{width:170px;margin:0 auto}
.pimg{width:100%;height:auto;display:block;user-select:none}
.bubble{position:relative;background:var(--surf);border:2px solid var(--line);border-radius:20px;padding:12px 16px;box-shadow:var(--sh);font-weight:500;text-align:center}
.bubble:after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;background:var(--surf);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.opts{display:grid;gap:10px}
.opt{background:var(--surf);border:3px solid var(--line);border-radius:18px;padding:12px 16px;text-align:left;font-weight:500;min-height:52px;box-shadow:var(--sh)}
.opt:active{border-color:var(--coral)}
.inp{width:100%;min-height:56px;border-radius:18px;border:3px solid var(--line);background:var(--surf);color:var(--ink);font:700 22px 'Mali',sans-serif;padding:0 16px;text-align:center}
.inp:focus{outline:none;border-color:var(--mint)}
.err{color:var(--coral-d);font-weight:700;min-height:22px;text-align:center}
.big{font:700 54px/1 'Mali',sans-serif;color:var(--coral-d)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.macros div{border-radius:16px;padding:10px 4px;font-weight:700}
.macros small{display:block;font-weight:500;color:var(--mute)}
.m-p{background:color-mix(in srgb,var(--mint) 25%,var(--surf))}.m-f{background:color-mix(in srgb,var(--butter) 30%,var(--surf))}.m-c{background:color-mix(in srgb,var(--coral) 18%,var(--surf))}
canvas#sign{width:100%;height:170px;background:var(--surf);border:3px dashed var(--line);border-radius:20px;touch-action:none;display:block}
/* home */
.stage{position:relative;border-radius:28px;border:2px solid var(--line);box-shadow:var(--sh);overflow:hidden;aspect-ratio:900/738;background:#EBCB9C}
.roombg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hearts{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:rgba(255,255,255,.78);border-radius:999px;padding:3px 10px}
.hearts svg{width:24px;height:24px}
.rail{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.rail img{width:38px;height:38px;background:rgba(255,255,255,.8);border-radius:12px;padding:2px;}
.petbox{position:absolute;left:50%;bottom:6%;width:58%;transform:translateX(-50%)}
.petbox img{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.petbox.chomp img{animation:chomp .5s ease-in-out 2}
@keyframes bob{50%{transform:translateY(-3px) scale(1.01,.99)}}
@keyframes chomp{50%{transform:scale(1.08,.92)}}
.fly{position:absolute;left:50%;top:60%;font-size:40px;animation:fly .65s ease-in forwards;pointer-events:none;z-index:3}

.pop{position:absolute;left:50%;top:28%;font:700 22px 'Mali',sans-serif;color:#fff;-webkit-text-stroke:5px #C4553A;paint-order:stroke fill;animation:pop 1.1s ease-out forwards;pointer-events:none;white-space:nowrap;z-index:3}
@keyframes pop{from{transform:translate(-50%,10px) scale(.6);opacity:0}30%{opacity:1}to{transform:translate(-50%,-30px) scale(1.15);opacity:0}}
.growl{position:absolute;left:50%;bottom:21%;transform:translateX(-50%);font:700 15px 'Mali',sans-serif;color:#fff;-webkit-text-stroke:4px #8A4B2A;paint-order:stroke fill;white-space:nowrap;pointer-events:none;animation:gr 1.6s ease-in-out infinite}
@keyframes gr{0%,100%{opacity:.45;transform:translateX(-50%) translateY(2px)}50%{opacity:1;transform:translateX(-50%) translateY(-2px)}}
.bowl{position:absolute;right:11%;bottom:5%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.hatch{width:min(70vw,300px);margin:0 auto;cursor:pointer}
.himg{width:100%;height:auto;display:block;}
.wob{animation:wob 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.shake{animation:shk .12s linear 7;transform-origin:50% 90%}
@keyframes shk{0%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}100%{transform:rotate(-7deg)}}
.pop2{animation:pp .5s ease-out}
@keyframes pp{from{transform:scale(.6)}60%{transform:scale(1.12)}to{transform:scale(1)}}
.say{margin:8px 6px 6px}
.meter{height:18px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--mint);transition:width .5s}
.meter.over i{background:var(--butter)}
.mrow{display:grid;grid-template-columns:70px 1fr 74px;gap:8px;align-items:center;font-size:13px}
.mrow .meter{height:9px}
.meals{display:grid;gap:8px}
.meal{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:2px dashed var(--line)}
.meal:last-child{border:0}
.meal .e{font-size:26px}
.x{width:36px;height:36px;border-radius:12px;color:var(--mute);font-size:20px}
.dock{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dock .main{grid-column:1/-1;min-height:60px;font-size:18px}

.wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.wrap.hidden{display:none}
.scrim{position:absolute;inset:0;background:rgba(40,25,20,.5)}
.sheet{position:relative;width:100%;max-width:480px;max-height:88dvh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:18px 16px max(20px,env(safe-area-inset-bottom));display:grid;gap:12px;animation:up .22s ease-out}

.food{background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:8px 12px;min-height:44px;font-weight:500}
.food.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,var(--surf))}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:var(--surf);border-radius:14px;min-height:44px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--bg)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.pitem{display:flex;align-items:center;gap:8px;background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.pitem input[type=number]{width:78px;min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 16px 'Mali',sans-serif;text-align:center}
.thumb{width:100%;max-height:170px;object-fit:cover;border-radius:16px}
.tabs button{border-radius:14px;min-height:44px;font-weight:700;background:var(--surf);border:2px solid var(--line)}
.tabs button.on{background:var(--mint);border-color:var(--mint-d);color:#fff}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.it{background:var(--surf);border:2px solid var(--line);border-radius:18px;padding:8px;text-align:center;display:grid;gap:6px}
.it img{width:84px;height:84px;margin:0 auto;}
.it.worn{border-color:var(--mint-d)}
.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:14px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/*PLAN*/
const ACTF=[1.2,1.375,1.55,1.725],SPD=[0.25,0.5,0.75];
function calcPlan(p){
  const adj=p.sex==='m'?5:p.sex==='f'?-161:-78;
  const bmr=10*p.w+6.25*p.h-5*p.age+adj;
  const tdee=bmr*ACTF[p.act];
  const floor=p.sex==='m'?1500:1200;
  const diff=p.gw-p.w;
  const dir=Math.abs(diff)<0.5?0:(diff<0?-1:1);
  let target=tdee,capped=false,rate=0;
  if(dir<0){
    let d=SPD[p.sp]*7700/7;const cap=tdee*0.25;
    if(d>cap){d=cap;capped=true}
    target=tdee-d;
    if(target<floor){target=floor;capped=true}
    target=Math.min(target,tdee);
    rate=(tdee-target)*7/7700;
  }else if(dir>0){
    let s=SPD[p.sp]*7700/7;const cap=tdee*0.2;
    if(s>cap){s=cap;capped=true}
    target=tdee+s;rate=s*7/7700;
  }
  target=Math.round(target/10)*10;
  const weeks=rate>0.05?Math.ceil(Math.abs(diff)/rate):0;
  const pg=Math.round(1.6*p.w),fg=Math.round(target*0.25/9);
  const cg=Math.max(0,Math.round((target-pg*4-fg*9)/4));
  return{tdee:Math.round(tdee/10)*10,target,dir,capped,weeks,p:pg,f:fg,c:cg};
}

function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const m=900,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>b?res({blob:b,url:URL.createObjectURL(b)}):rej(new Error('blob')),'image/jpeg',.82);
      URL.revokeObjectURL(url);
    };
    im.onerror=()=>rej(new Error('img'));im.src=url;
  });
}
function parseItems(txt){
  const a=txt.indexOf('{'),b=txt.lastIndexOf('}');
  const j=JSON.parse(txt.slice(a,b+1));
  return (j.items||[]).slice(0,8).map(x=>({e:String(x.emoji||'🍽️').slice(0,4),n:String((S.lang==='th'?x.th:x.en)||x.th||x.en||'?').slice(0,40),k:Math.max(0,Math.min(3000,Math.round(+x.kcal||0))),p:+x.p||0,f:+x.f||0,c:+x.c||0,on:true})).filter(x=>x.k>0);
}

function prefetchArt(){
  const sp=S.pet.sp,names=['room',`egg-${sp}`,`egg-${sp}-8`];
  for(let g=0;g<3;g++)['','-happy','-hungry','-fat','-eating','-asleep'].forEach(s=>names.push(`${sp}-${g}${s}`));
  Object.keys(ACC).forEach(id=>names.push('wear-'+id));
  names.forEach(n=>fetch(IMG+n+'.webp').catch(()=>{}));
}
function warmArt(){if(navigator.serviceWorker&&navigator.serviceWorker.controller)prefetchArt()}
function initPWA(){
  if(window.claude||!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(prefetchArt).catch(()=>{});
}
/* ============ BOOT ============ */
view=S.onboarded&&S.plan?'home':'welcome';
render();
initSync();initSample();initPWA();
</script>
