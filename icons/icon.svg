<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#FFD39A"/><stop offset=".55" stop-color="#FFA57A"/><stop offset="1" stop-color="#FF7A6B"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".7" stop-color="#FFEFC2"/><stop offset="1" stop-color="#FFE3A3" stop-opacity="0"/></radialGradient>
  <radialGradient id="fur" cx=".42" cy=".3" r=".8"><stop offset="0" stop-color="#FFC77A"/><stop offset=".6" stop-color="#FBA24B"/><stop offset="1" stop-color="#EE8A34"/></radialGradient>
  <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F59A3E"/><stop offset="1" stop-color="#FFB45C"/></linearGradient>
  <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#FBF3EA"/><stop offset="1" stop-color="#EBD9C8"/></linearGradient>
  <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5FBFA5"/><stop offset=".5" stop-color="#86D8C0"/><stop offset="1" stop-color="#5FBFA5"/></linearGradient>
  <radialGradient id="cheek" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF6F7D" stop-opacity=".75"/><stop offset="1" stop-color="#FF6F7D" stop-opacity="0"/></radialGradient>
  <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A95"/><stop offset="1" stop-color="#F04A5E"/></linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
